# ============================================================================
# 𝐏ⁿ𝐀 𝐑𝐄𝐖𝐀𝐑𝐃𝐒 — Cloudflare Workers + D1 Configuration
# ============================================================================
# 1. Apply D1 SQL migrations BEFORE deploying:
#      npx wrangler d1 migrations apply pna-rewards-db --remote
#
# 2. Set Worker secrets (NEVER put secrets in this file):
#      npx wrangler secret put BOT_TOKEN
#      npx wrangler secret put WEBHOOK_SECRET
#
# 3. Deploy:
#      npx wrangler deploy
#
# NOTE: Previous KV namespace is intentionally untouched in Cloudflare as a
#       read-only backup and is no longer bound to this Worker.
# ============================================================================

name = "pna-rewards-bot"
main = "src/index.js"
compatibility_date = "2025-01-01"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "pna-rewards-db"
database_id = "058b6c52-f03c-4520-89c7-b04432bfb974"
migrations_dir = "migrations"

[vars]
OWNER_ID = "8838351233"
SUPPORT_USERNAME = "@Pritam_power"
UPDATE_CHANNEL_URL = "https://t.me/pnarewards"
# Secretary Mode (PnA X Logs) target channel:
# Public channel https://t.me/pnarewards uses "@pnarewards" (auto-resolves numeric ID when bot is admin).
# If switching to a private channel, set its numeric ID (e.g. "-1001234567890") after making the bot admin.
PNA_LOG_CHANNEL_ID = "@pnarewards"
TIMEZONE = "Asia/Kolkata"
WEBHOOK_PATH = "/webhook"
# Optional: set BOT_USERNAME (without @) to avoid an extra getMe lookup on cold start
BOT_USERNAME = ""
